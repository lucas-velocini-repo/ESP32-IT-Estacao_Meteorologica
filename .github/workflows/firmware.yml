name: Firmware build and host tests
on:
  pull_request:
  push:
    branches: [main, development, feature/remote-interval]
permissions:
  contents: read
jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install platformio
      - run: pio run
      - name: Host routine, power, transport and persistence tests
        run: bash scripts/run-host-tests.sh
